name: DouYin Spark Flow Schedule Run
concurrency:
  group: douyin-spark-flow
  cancel-in-progress: false
on:
  workflow_dispatch: # 允许手动触发
  schedule: # 定时任务
    - cron: "0 20 * * *" # 每天 20:00 UTC（对应北京时间次日 4:00）
jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Ensure browsers are installed
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables and Secrets to JSON
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py
    - name: Run DouYin Spark Flow
      run: python main.py
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: run-logs
        path: logs/
        retention-days: 14
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
  notify-result:
    if: ${{ always() && !cancelled() }}
    needs: run-main
    runs-on: ubuntu-latest
    environment: user-data
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        if: ${{ needs.run-main.result == 'failure' }}
        with:
          name: run-logs
          path: logs
      - name: Send failure email
        if: ${{ needs.run-main.result == 'failure' }}
        env:
          MAIL_ADDRESS: ${{ vars.MAIL_ADDRESS }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python utils/email_alert.py
          --subject "抖音续火花自动任务失败"
          --body "任务执行失败，请检查日志和附件截图。运行记录：$RUN_URL"
          --attachment-dir logs
      - name: Create, update, or close failure alert
        if: ${{ always() }}
        uses: actions/github-script@v8
        env:
          TASK_RESULT: ${{ needs.run-main.result }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '抖音续火花自动任务失败';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const alert = issues.find(issue => !issue.pull_request && issue.title === title);

            if (process.env.TASK_RESULT === 'success') {
              if (alert) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: `自动任务已恢复成功。\n\n运行记录：${runUrl}`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              return;
            }

            const body = [
              '每日续火花任务执行失败。',
              '',
              `- 结果：${process.env.TASK_RESULT}`,
              `- 运行记录：${runUrl}`,
              '- 请检查 Actions 日志和 `run-logs` 失败截图。',
            ].join('\n');

            if (alert) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: alert.number,
                body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
